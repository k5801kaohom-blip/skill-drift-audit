name: verify

# Proves every push and pull request leaves the repository in a state that a fresh
# clone can install and use. The failure this workflow exists to catch: SKILL.md
# documenting a file that was never committed, so the skill looks complete but is
# unusable for anyone who clones it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, to catch drift not caused by a push — for example a file deleted on
    # the remote, or a dependency of the checks disappearing.
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and the real remote, so the commit-sync stage is meaningful.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          echo "runner : $RUNNER_OS"
          echo "commit : $GITHUB_SHA"
          echo "ref    : $GITHUB_REF"
          python3 --version
          git --version

      # On a pull_request event the checked-out HEAD is a merge commit, so
      # HEAD != origin/main is expected and the sync stages would report a false
      # failure. They therefore run only on push; pull requests run the integrity
      # stages offline.
      - name: Repository integrity
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ./verify_sync.sh --json verify-report.json
          else
            ./verify_sync.sh --offline --json verify-report.json
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "## Repository verification" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -f verify-report.json ]; then
            python3 scripts/ci_summary.py verify-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_verify-report.json was not produced_" >> "$GITHUB_STEP_SUMMARY"
          fi

  contract:
    name: standalone contract check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Runs the checks a consumer would run immediately after installing, so a
      # regression in either script fails the build on its own signal rather than
      # being masked by the aggregate script.
      - name: Every documented resource exists and compiles
        run: |
          python3 skill-drift-audit/scripts/check_skill_contract.py \
            --skill skill-drift-audit --json contract-report.json

      - name: Citizen test kit emits a kit
        run: |
          set -euo pipefail
          KIT=skill-drift-audit/scripts/citizen_test_kit.py
          OUT="$(mktemp -d)"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python3 "$KIT" --emit --skill-name skill-drift-audit \
            --artifact-type "a real artifact of the relevant type" --out "$OUT"
          test -f "$OUT/公民測試_任務單.md"
          test -f "$OUT/公民測試_結果回報單.json"

      - name: Evaluator discriminates PASS from COACHED
        run: |
          set -euo pipefail
          KIT=skill-drift-audit/scripts/citizen_test_kit.py

          # Build a passing result, then a coached one, from the emitted template.
          python3 scripts/ci_make_results.py "$OUT"

          # A clean result must evaluate to PASS with exit code 0.
          python3 "$KIT" --evaluate --result "$OUT/pass.json" | grep -q "VERDICT: PASS"

          # A coached result must exit non-zero. This is the assertion that proves
          # the evaluator discriminates rather than merely runs.
          set +e
          python3 "$KIT" --evaluate --result "$OUT/coached.json" > "$OUT/coached.out" 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 1 ]; then
            echo "expected exit 1 for COACHED, got $RC"
            cat "$OUT/coached.out"
            exit 1
          fi
          grep -q "VERDICT: COACHED" "$OUT/coached.out"
          echo "PASS -> exit 0; COACHED -> exit 1 (evaluator discriminates)"

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: contract-report.json
          if-no-files-found: warn
