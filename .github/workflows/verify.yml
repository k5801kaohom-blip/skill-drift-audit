name: verify

# Proves every push and pull request leaves the repository in a state that a fresh
# clone can install and use. The failure this workflow exists to catch: SKILL.md
# documenting a file that was never committed, so the skill looks complete but is
# unusable for anyone who clones it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, to catch drift that is not caused by a push — for example a file
    # deleted on the remote, or a dependency of the checks disappearing.
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and the real remote, so the commit-sync stage is meaningful.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          echo "runner : $RUNNER_OS"
          echo "commit : $GITHUB_SHA"
          echo "ref    : $GITHUB_REF"
          python3 --version
          git --version

      # Stage 1 of verify_sync.sh fetches origin/main. On a pull_request event the
      # checked-out HEAD is a merge commit, so HEAD != origin/main is expected and
      # the script would report a false failure. The sync stages are therefore run
      # only on push; pull requests run the integrity stages.
      - name: Repository integrity
        id: integrity
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ./verify_sync.sh --json verify-report.json
          else
            ./verify_sync.sh --offline --json verify-report.json
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Repository verification"
            echo
            if [ -f verify-report.json ]; then
              python3 - <<'PY'
import json, os
from pathlib import Path
p = Path("verify-report.json")
if not p.is_file():
    print("_no report produced_")
    raise SystemExit(0)
r = json.loads(p.read_text(encoding="utf-8"))
print(f"**Verdict: {r['verdict']}** — {r['passed']} passed, {r['failed']} failed, {r['skipped']} skipped")
print()
print("| Status | Check | Detail |")
print("| --- | --- | --- |")
for c in r["checks"]:
    icon = {"PASS": "pass", "FAIL": "**FAIL**", "SKIP": "skip"}.get(c["status"], c["status"])
    print(f"| {icon} | {c['check']} | {c['detail']} |")
PY
            else
              echo "_verify-report.json was not produced_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  contract:
    name: standalone contract check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Runs the two checks a consumer would run immediately after installing, so a
      # regression in either script fails the build on its own signal rather than
      # being masked by the aggregate script.
      - name: Every documented resource exists and compiles
        run: |
          python3 skill-drift-audit/scripts/check_skill_contract.py \
            --skill skill-drift-audit --json contract-report.json

      - name: Citizen test kit emits and evaluates
        run: |
          set -euo pipefail
          KIT=skill-drift-audit/scripts/citizen_test_kit.py
          OUT="$(mktemp -d)"

          # 1. it can emit a kit
          python3 "$KIT" --emit --skill-name skill-drift-audit \
            --artifact-type "a real artifact of the relevant type" --out "$OUT"

          test -f "$OUT/公民測試_任務單.md"
          test -f "$OUT/公民測試_結果回報單.json"

          # 2. a clean result evaluates to PASS with exit code 0
          python3 - "$OUT" <<'PY'
import json, sys
from pathlib import Path
out = Path(sys.argv[1])
d = json.loads((out / "公民測試_結果回報單.json").read_text(encoding="utf-8"))
d["tester_name"] = "ci"; d["tester_role"] = "automated"
d["artifact_description"] = "ci fixture"
d["validity"] = {k: True for k in d["validity"]}
d["attempts"] = [{"attempt": 1, "command": "run", "output": "ok",
                  "exit_code": 0, "outcome": "success", "blocked_on": ""}]
d["help_requests"] = []; d["friction"] = []
d["output_matches_source"] = True
(out / "pass.json").write_text(json.dumps(d, ensure_ascii=False), encoding="utf-8")
PY
          python3 "$KIT" --evaluate --result "$OUT/pass.json" | grep -q "VERDICT: PASS"

          # 3. a coached result must exit non-zero — this is the assertion that proves
          #    the evaluator actually discriminates, not merely that it runs.
          python3 - "$OUT" <<'PY'
import json, sys
from pathlib import Path
out = Path(sys.argv[1])
d = json.loads((out / "pass.json").read_text(encoding="utf-8"))
d["help_requests"] = [{"at_step": "step 2", "needed": "someone to explain the path"}]
(out / "coached.json").write_text(json.dumps(d, ensure_ascii=False), encoding="utf-8")
PY
          set +e
          python3 "$KIT" --evaluate --result "$OUT/coached.json" > coached.out 2>&1
          RC=$?
          set -e
          test "$RC" -eq 1 || { echo "expected exit 1 for COACHED, got $RC"; cat coached.out; exit 1; }
          grep -q "VERDICT: COACHED" coached.out

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: contract-report.json
          if-no-files-found: warn
